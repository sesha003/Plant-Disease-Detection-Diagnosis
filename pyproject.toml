[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plantdx"
version = "1.0.0"
description = "Image-based plant disease detection on PlantVillage (CNN from scratch + transfer learning)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2", "torchvision>=0.17", "huggingface_hub>=0.23", "numpy>=1.24",
    "pillow>=10.0", "scikit-learn>=1.3", "matplotlib>=3.7", "pyyaml>=6.0", "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
